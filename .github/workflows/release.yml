name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish artifacts to GitHub Releases
        type: boolean
        default: true
      release_tag:
        description: Release tag, defaults to local-agent package version
        type: string
        required: false
        default: ''
      build_windows:
        description: Build Windows installer
        type: boolean
        default: true
      build_macos:
        description: Build macOS DMG
        type: boolean
        default: true
      build_linux:
        description: Build Linux AppImage, Debian package, and Arch package
        type: boolean
        default: true
      build_android:
        description: Build Android APK
        type: boolean
        default: true
  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installer
    runs-on: windows-2022
    if: github.event_name == 'push' || inputs.build_windows
    defaults:
      run:
        working-directory: local-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: local-agent/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: |
          npm run dist:win 2>&1 | Tee-Object -FilePath windows-build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Windows installer build failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          npm run dist:win:portable 2>&1 | Tee-Object -FilePath windows-portable-build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Windows portable build failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Get-ChildItem -Path release -File | Sort-Object Name | Format-Table Name,Length
          if (-not (Get-ChildItem -Path release -Filter *-setup.exe -File -ErrorAction SilentlyContinue)) {
            Write-Error "Windows installer was not generated under local-agent/release."
            exit 1
          }
          if (-not (Get-ChildItem -Path release -Filter *-portable.exe -File -ErrorAction SilentlyContinue)) {
            Write-Error "Windows portable package was not generated under local-agent/release."
            exit 1
          }

      - name: Upload Windows build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-build-log
          path: |
            local-agent/windows-build.log
            local-agent/windows-portable-build.log

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentflow-windows
          path: |
            local-agent/release/*-setup.exe
            local-agent/release/*-portable.exe
          if-no-files-found: error

  macos:
    name: macOS DMG
    runs-on: macos-latest
    if: github.event_name == 'push' || inputs.build_macos
    defaults:
      run:
        working-directory: local-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: local-agent/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build macOS DMG
        run: npm run dist:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentflow-macos
          path: |
            local-agent/release/*.dmg
          if-no-files-found: error

  linux:
    name: Linux AppImage, Debian package, and Arch package
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.build_linux
    defaults:
      run:
        working-directory: local-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: local-agent/package-lock.json

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libarchive-tools rpm ruby ruby-dev
          sudo gem install --no-document fpm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux packages
        run: npm run dist:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentflow-linux
          path: |
            local-agent/release/*.AppImage
            local-agent/release/*.deb
            local-agent/release/*.pacman
            local-agent/release/*.pkg.tar.*
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.build_android
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Configure Android SDK path
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-${ANDROID_SDK_HOME:-}}}"
          test -n "$SDK_DIR"
          printf 'sdk.dir=%s\n' "$SDK_DIR" > local.properties

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Configure release signing
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p release-signing

          if [ -n "${ANDROID_RELEASE_KEYSTORE_BASE64:-}" ]; then
            missing=0
            for name in ANDROID_RELEASE_STORE_PASSWORD ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD; do
              if [ -z "${!name:-}" ]; then
                echo "::error title=Android signing secret missing::$name is required when ANDROID_RELEASE_KEYSTORE_BASE64 is set."
                missing=1
              fi
            done
            if [ "$missing" -ne 0 ]; then
              exit 1
            fi
            printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > release-signing/agentflow-release.jks
          else
            echo "::notice title=Android public install signing::ANDROID_RELEASE_KEYSTORE_BASE64 is not configured; using the repository public install key for sideload releases."
            cp ci-signing/agentflow-public-install.jks release-signing/agentflow-release.jks
            ANDROID_RELEASE_STORE_PASSWORD="agentflow-public-install"
            ANDROID_RELEASE_KEY_ALIAS="agentflow-public-install"
            ANDROID_RELEASE_KEY_PASSWORD="agentflow-public-install"
          fi

          {
            printf 'storeFile=%s\n' 'release-signing/agentflow-release.jks'
            printf 'storePassword=%s\n' "$ANDROID_RELEASE_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_RELEASE_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_RELEASE_KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace clean assembleRelease 2>&1 | tee android-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summary=$(grep -E -m 1 'Execution failed|SDK location|Could not|this and base files|e: ' android-build.log || true)
            if [ -z "$summary" ]; then
              summary=$(awk '/\* What went wrong:/{getline; print; exit}' android-build.log || true)
            fi
            echo "::error title=Android build failed::${summary:-See Android build log above.}"
            exit "$status"
          fi

      - name: Verify signed release APK
        run: |
          mapfile -t signed_apks < <(find build/app/outputs/apk/release -maxdepth 1 -type f -name '*-release.apk' | sort)
          if [ "${#signed_apks[@]}" -eq 0 ]; then
            echo "::error title=Signed APK missing::Release build did not produce a signed installable APK. Check Android signing configuration."
            find build/app/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print
            exit 1
          fi
          for apk in "${signed_apks[@]}"; do
            if echo "$apk" | grep -q 'unsigned'; then
              echo "::error title=Unsigned APK rejected::$apk"
              exit 1
            fi
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"
          done

      - name: Stage Android release artifacts
        run: |
          version_name="$(grep -E 'versionName\s*=' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' | head -n 1)"
          version_code="$(grep -E 'versionCode\s*=' app/build.gradle.kts | sed -E 's/.*=\s*([0-9]+).*/\1/' | head -n 1)"
          if [ -z "$version_name" ] || [ -z "$version_code" ]; then
            echo "::error title=Android version missing::Could not read versionName/versionCode from app/build.gradle.kts."
            exit 1
          fi

          mkdir -p build/release-assets
          mapfile -t signed_apks < <(find build/app/outputs/apk/release -maxdepth 1 -type f -name '*-release.apk' | sort)
          for index in "${!signed_apks[@]}"; do
            suffix=""
            if [ "${#signed_apks[@]}" -gt 1 ]; then
              suffix="-$((index + 1))"
            fi
            cp "${signed_apks[$index]}" "build/release-assets/AgentFlow-android-${version_name}-${version_code}${suffix}-release.apk"
          done

      - name: Upload Android build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-build-log
          path: android-app/android-build.log

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentflow-android
          path: android-app/build/release-assets/*-release.apk
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    if: >-
      ${{ always() &&
          (github.event_name == 'push' || inputs.publish_release) &&
          (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
          (needs.macos.result == 'success' || needs.macos.result == 'skipped') &&
          (needs.linux.result == 'success' || needs.linux.result == 'skipped') &&
          (needs.android.result == 'success' || needs.android.result == 'skipped') &&
          !contains(needs.*.result, 'cancelled') }}
    needs:
      - windows
      - macos
      - linux
      - android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Resolve release tag
        id: release-meta
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          tag="$(printf '%s' "$REQUESTED_TAG" | xargs)"
          if [ -z "$tag" ]; then
            version="$(node -p "require('./local-agent/package.json').version")"
            tag="v$version"
          fi

          case "$tag" in
            v*) ;;
            *) tag="v$tag" ;;
          esac

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          git tag -f "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag" --force

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release-meta.outputs.tag }}
        run: |
          mkdir -p release-assets
          while IFS= read -r -d '' file; do
            artifact_name="$(basename "$(dirname "$file")")"
            case "$artifact_name" in
              *build-log*) continue ;;
            esac
            base_name="$(basename "$file")"
            case "$base_name" in
              *unsigned*.apk) continue ;;
              *.apk|*.dmg|*.AppImage|*.deb|*.pacman|*.pkg.tar.*|*-setup.exe|*-portable.exe) ;;
              *) continue ;;
            esac
            cp "$file" "release-assets/${base_name}"
          done < <(find dist-artifacts -type f -print0 | sort -z)

          mapfile -t files < <(find release-assets -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error title=Release assets missing::No artifact files were downloaded for release publishing."
            exit 1
          fi

          windows_installer_count="$(find release-assets -type f -name '*-setup.exe' | wc -l)"
          if [ "$windows_installer_count" -eq 0 ]; then
            echo "::error title=Windows installer missing::Windows release must publish an installer package ending with -setup.exe."
            exit 1
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release view "$TAG_NAME" --json assets --jq '.assets[].name' |
              while IFS= read -r asset_name; do
                case "$asset_name" in
                  *unsigned*.apk) gh release delete-asset "$TAG_NAME" "$asset_name" -y ;;
                  *.apk|*.dmg|*.AppImage|*.deb|*.pacman|*.pkg.tar.*|*-setup.exe|*-portable.exe) gh release delete-asset "$TAG_NAME" "$asset_name" -y ;;
                  *) gh release delete-asset "$TAG_NAME" "$asset_name" -y ;;
                esac
              done
            gh release upload "$TAG_NAME" "${files[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${files[@]}" \
              --title "AgentFlow $TAG_NAME" \
              --notes "Automated multi-platform build artifacts."
          fi
