name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop checks
    runs-on: windows-latest
    defaults:
      run:
        working-directory: local-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: local-agent/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build desktop
        run: npm run build

  relay:
    name: Relay server checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: relay-server/go.mod
          cache-dependency-path: relay-server/go.sum

      - name: Run tests
        run: go test ./...

  android:
    name: Android checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Configure hosted Android SDK
        run: bash scripts/setup-ci-sdk.sh

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace clean assembleDebug 2>&1 | tee android-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summary=$(grep -E -m 1 'Execution failed|SDK location|Could not|this and base files|e: ' android-build.log || true)
            if [ -z "$summary" ]; then
              summary=$(awk '/\* What went wrong:/{getline; print; exit}' android-build.log || true)
            fi
            echo "::error title=Android build failed::${summary:-See Android build log above.}"
            exit "$status"
          fi

      - name: Upload Android build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-build-log
          path: android-app/android-build.log

      # A compile-only check cannot catch an incomplete voice model.
      - name: Test Android
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Upload Android test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android-app/build/app/reports/tests
