appId: com.claudecode.agent
productName: "AgentFlow"
asar: true
publish:
  provider: github
  owner: "714307168"
  repo: "AgentFlow"
  releaseType: release

files:
  - "dist/**/*"
  - "renderer/**/*"
  - "assets/**/*"
  - "package.json"

directories:
  output: release
  buildResources: assets

extraResources:
  - from: node_modules/node-pty
    to: node_modules/node-pty
  - from: assets/sounds
    to: sounds

win:
  icon: app-icon.ico
  artifactName: "${productName}-${version}-${arch}-setup.${ext}"
  target:
    - target: nsis
      arch:
        - x64
        - ia32

nsis:
  include: assets/installer.nsh
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  artifactName: "${productName}-${version}-${arch}.${ext}"
  target:
    - target: dmg
      arch:
        - x64
        - arm64

linux:
  icon: icons
  category: Development
  artifactName: "${productName}-${version}-${arch}.${ext}"
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: pacman
      arch:
        - x64

deb:
  artifactName: "${productName}-${version}-${arch}.${ext}"
  afterInstall: assets/linux-after-install.sh
  afterRemove: assets/linux-after-remove.sh
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libgbm1
    - libasound2

pacman:
  artifactName: "${productName}-${version}-${arch}.${ext}"
  afterInstall: assets/linux-after-install.sh
  afterRemove: assets/linux-after-remove.sh
  depends:
    - alsa-lib
    - at-spi2-core
    - c-ares
    - cairo
    - dbus
    - expat
    - ffmpeg
    - gcc-libs
    - glib2
    - glibc
    - gtk3
    - hicolor-icon-theme
    - libdrm
    - libevent
    - libnotify
    - libsecret
    - libvpx
    - libx11
    - libxcb
    - libxcomposite
    - libxdamage
    - libxext
    - libxfixes
    - libxkbcommon
    - libxrandr
    - libxss
    - libxtst
    - libxslt
    - llhttp
    - mesa
    - minizip
    - nspr
    - nss
    - pango
    - re2
    - snappy
    - xdg-utils
    - zlib
