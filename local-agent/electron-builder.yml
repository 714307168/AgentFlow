appId: com.claudecode.agent
productName: "AgentFlow"
asar: true
publish:
  provider: generic
  url: "https://relay.liuyg.cn/downloads/desktop"
  channel: stable

files:
  - "dist/**/*"
  - "renderer/**/*"
  - "assets/**/*"
  - "package.json"

directories:
  output: release
  buildResources: assets

extraResources:
  - from: node_modules/node-pty
    to: node_modules/node-pty
  - from: assets/sounds
    to: sounds

win:
  icon: app-icon.ico
  artifactName: "${productName}-${version}-${arch}-setup.${ext}"
  target:
    - target: nsis
      arch:
        - x64

nsis:
  include: assets/installer.nsh
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64

linux:
  icon: app-icon.png
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: pacman
      arch:
        - x64

deb:
  afterInstall: assets/linux-after-install.sh
  afterRemove: assets/linux-after-remove.sh
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libgbm1
    - libasound2

pacman:
  afterInstall: assets/linux-after-install.sh
  afterRemove: assets/linux-after-remove.sh
  depends:
    - c-ares
    - ffmpeg
    - gtk3
    - libevent
    - libvpx
    - libxslt
    - libxss
    - llhttp
    - minizip
    - nspr
    - nss
    - re2
    - snappy
    - libnotify
