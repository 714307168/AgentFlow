appId: com.claudecode.agent
productName: "AgentFlow"
asar: true
publish:
  provider: generic
  url: "https://relay.liuyg.cn/downloads/desktop"
  channel: stable

files:
  - "dist/**/*"
  - "renderer/**/*"
  - "assets/**/*"
  - "package.json"

directories:
  output: release
  buildResources: assets

extraResources:
  - from: node_modules/node-pty
    to: node_modules/node-pty
  - from: assets/sounds
    to: sounds

win:
  icon: app-icon.ico
  artifactName: "${productName}-${version}-${arch}-setup.${ext}"
  target:
    - target: nsis
      arch:
        - x64

nsis:
  include: assets/installer.nsh
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64

linux:
  target:
    - target: AppImage
      arch:
        - x64
